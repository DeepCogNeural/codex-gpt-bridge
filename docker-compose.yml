services:
  gpt-sol-mcp:
    build: .
    image: registry.kasemsan.com/openai/gpt-sol-mcp:latest
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      CODEX_CHATGPT_MODEL: ${CODEX_CHATGPT_MODEL:-gpt-5.6-sol}
      CODEX_CHATGPT_TIMEOUT_MS: ${CODEX_CHATGPT_TIMEOUT_MS:-180000}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8084
      MCP_TOKEN: ${MCP_TOKEN}
    ports:
      - "8084:8084"
